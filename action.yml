name: 'Logit GitHub Card'
description: 'Generate SVG profile cards from GitHub contribution statistics'

branding:
  icon: 'bar-chart-2'
  color: 'blue'

inputs:
  username:
    description: 'GitHub username'
    required: true
  token:
    description: 'GitHub token (PAT with read access)'
    default: ${{ github.token }}
  command:
    description: 'card or multi'
    default: 'card'
  days:
    description: 'Number of days to look back (card only)'
    default: '365'
  periods:
    description: 'Comma-separated periods for multi command (e.g. week,month,year)'
    default: 'week,month,year'
  include-forks:
    description: 'Include forked repositories'
    default: 'false'
  include-contributed:
    description: 'Include contributed repositories'
    default: 'false'
  include-private:
    description: 'Include token holder''s own private repositories (requires a PAT belonging to `username`; the default workflow token will not work)'
    default: 'false'
  exclude-lang:
    description: 'Comma-separated languages to exclude'
    default: ''
  exclude:
    description: |
      Multi-line exclusions. One rule per line.
      Format: REPO[:lang:LANG]
      Examples:
        my-repo
        my-repo:lang:markdown
        frontend,backend:lang:css
    default: ''
  short:
    description: 'Use compact card layout (card only)'
    default: 'false'
  lang-rows:
    description: 'Number of language rows (card only)'
    default: '2'
  title:
    description: 'Custom card title (card only)'
    default: ''
  output:
    description: 'Output SVG file path'
    default: 'profile-card.svg'
  retry-count:
    description: 'Number of retry attempts for the Generate SVG step'
    default: '3'
  retry-delay:
    description: 'Delay in seconds between retry attempts'
    default: '5'

outputs:
  svg-path:
    description: 'Path to the generated SVG file'
    value: ${{ inputs.output }}

runs:
  using: 'composite'
  steps:
    - uses: dtolnay/rust-toolchain@stable

    - name: Compute logit source hash
      id: srchash
      shell: bash
      run: |
        HASH=$(find "${{ github.action_path }}" -type f \( -name 'Cargo.toml' -o -name 'Cargo.lock' -o -name 'build.rs' -o -path '*/src/*' \) \
          -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
        echo "hash=$HASH" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      id: cache-logit
      with:
        path: ~/.cargo/bin/logit
        key: logit-${{ runner.os }}-${{ steps.srchash.outputs.hash }}
        restore-keys: |
          logit-${{ runner.os }}-

    - name: Compute GitHub data cache key
      id: datakey
      shell: bash
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_DAYS: ${{ inputs.days }}
        INPUT_PERIODS: ${{ inputs.periods }}
        INPUT_INCLUDE_FORKS: ${{ inputs.include-forks }}
        INPUT_INCLUDE_CONTRIBUTED: ${{ inputs.include-contributed }}
        INPUT_INCLUDE_PRIVATE: ${{ inputs.include-private }}
      run: |
        set -euo pipefail
        HASH=$(printf '%s\0' "$INPUT_USERNAME" "$INPUT_COMMAND" "$INPUT_DAYS" "$INPUT_PERIODS" "$INPUT_INCLUDE_FORKS" "$INPUT_INCLUDE_CONTRIBUTED" "$INPUT_INCLUDE_PRIVATE" | sha256sum | cut -d' ' -f1)
        echo "hash=$HASH" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/logit-github-cache
        key: logit-data-v4-${{ runner.os }}-${{ steps.datakey.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          logit-data-v4-${{ runner.os }}-${{ steps.datakey.outputs.hash }}-

    - name: Install logit
      if: steps.cache-logit.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked --path "${{ github.action_path }}" --features github --force

    - name: Generate SVG
      shell: bash
      env:
        LOGIT_GITHUB_CACHE_DIR: ${{ runner.temp }}/logit-github-cache
        INPUT_USERNAME: ${{ inputs.username }}
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_DAYS: ${{ inputs.days }}
        INPUT_PERIODS: ${{ inputs.periods }}
        INPUT_INCLUDE_FORKS: ${{ inputs.include-forks }}
        INPUT_INCLUDE_CONTRIBUTED: ${{ inputs.include-contributed }}
        INPUT_INCLUDE_PRIVATE: ${{ inputs.include-private }}
        INPUT_EXCLUDE_LANG: ${{ inputs.exclude-lang }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_SHORT: ${{ inputs.short }}
        INPUT_LANG_ROWS: ${{ inputs.lang-rows }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_RETRY_COUNT: ${{ inputs.retry-count }}
        INPUT_RETRY_DELAY: ${{ inputs.retry-delay }}
      run: |
        set -euo pipefail

        invalid_input() {
          echo "Invalid input: $1" >&2
          exit 2
        }

        is_nonnegative_decimal() {
          [[ "$1" =~ ^([0-9]+([.][0-9]*)?|[.][0-9]+)$ ]]
        }

        is_positive_decimal() {
          is_nonnegative_decimal "$1" || return 1
          local digits="${1//./}"
          [[ "$digits" =~ [1-9] ]]
        }

        case "$INPUT_COMMAND" in
          card|multi) ;;
          *) invalid_input command ;;
        esac

        for boolean in "$INPUT_INCLUDE_FORKS" "$INPUT_INCLUDE_CONTRIBUTED" "$INPUT_INCLUDE_PRIVATE" "$INPUT_SHORT"; do
          case "$boolean" in
            true|false) ;;
            *) invalid_input boolean ;;
          esac
        done

        [[ "$INPUT_RETRY_COUNT" =~ ^[0-9]+$ ]] || invalid_input retry-count
        is_nonnegative_decimal "$INPUT_RETRY_DELAY" || invalid_input retry-delay
        is_positive_decimal "$INPUT_DAYS" || invalid_input days
        [[ "$INPUT_LANG_ROWS" =~ ^[0-9]+$ ]] || invalid_input lang-rows

        if [ "$INPUT_COMMAND" = "multi" ]; then
          [[ -n "$INPUT_PERIODS" && "$INPUT_PERIODS" != ,* && "$INPUT_PERIODS" != *, && "$INPUT_PERIODS" != *,,* ]] || invalid_input periods
          IFS=',' read -r -a periods <<< "$INPUT_PERIODS"
          for period in "${periods[@]}"; do
            case "$period" in
              week|month|quarter|half|year) ;;
              *)
                period_days="${period%[dD]}"
                is_positive_decimal "$period_days" || invalid_input periods
                ;;
            esac
          done
        fi

        cmd=(logit github "$INPUT_COMMAND" "$INPUT_USERNAME" --refresh-cache)
        if [ "$INPUT_COMMAND" = "multi" ]; then
          cmd+=(-p "$INPUT_PERIODS")
        else
          cmd+=(-d "$INPUT_DAYS")
          if [ "$INPUT_SHORT" = "true" ]; then cmd+=(--short); fi
          cmd+=(--lang-rows "$INPUT_LANG_ROWS")
          if [ -n "$INPUT_TITLE" ]; then cmd+=(--title "$INPUT_TITLE"); fi
        fi

        if [ "$INPUT_INCLUDE_FORKS" = "true" ]; then cmd+=(--include-forks); fi
        if [ "$INPUT_INCLUDE_CONTRIBUTED" = "true" ]; then cmd+=(--include-contributed); fi
        if [ "$INPUT_INCLUDE_PRIVATE" = "true" ]; then cmd+=(--include-private); fi
        if [ -n "$INPUT_EXCLUDE_LANG" ]; then cmd+=(--exclude-lang "$INPUT_EXCLUDE_LANG"); fi
        if [ -n "$INPUT_EXCLUDE" ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            if [ -n "$line" ]; then cmd+=(--exclude "$line"); fi
          done <<< "$INPUT_EXCLUDE"
        fi
        cmd+=(-o "$INPUT_OUTPUT")

        attempt=1
        while :; do
          echo "::group::Attempt $attempt"
          set +e
          "${cmd[@]}"
          exit_code=$?
          set -e
          echo "::endgroup::"

          if [ "$exit_code" -eq 0 ]; then
            echo "Succeeded on attempt $attempt"
            exit 0
          fi
          if [ "$attempt" -gt "$INPUT_RETRY_COUNT" ]; then
            echo "All attempts failed. Last exit code: $exit_code"
            exit "$exit_code"
          fi

          echo "Attempt $attempt failed with exit code $exit_code. Retrying in ${INPUT_RETRY_DELAY}s..."
          sleep "$INPUT_RETRY_DELAY"
          attempt=$((attempt + 1))
        done
